services:
  postgres:
    image: postgres:18-alpine
    container_name: ecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Chỉ chạy khi volume còn trống - tạo sẵn product_db và auth_db.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-net

  # Redis
  redis:
    image: redis:8.6.4-alpine
    container_name: ecom-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-net

  # Kafka (KRaft) — image chính thức Apache
  kafka:
    image: apache/kafka:4.2.1
    container_name: ecom-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT}:29092"
    environment:
      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Listeners
      # INTERNAL: service trong Docker -> kafka:9092
      # EXTERNAL: máy host -> localhost:29092
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # Dev settings
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
    networks:
      - ecom-net

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ecom-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ecom-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ecom-net

  # Auth service (OIDC provider)
  auth:
    build:
      context: ..
      dockerfile: services/Auth/Ecommerce.Auth/Dockerfile
    container_name: ecom-auth
    restart: unless-stopped
    ports:
      # Publish đúng port mà issuer công bố, để URL trong và ngoài Docker trùng nhau.
      - "${AUTH_PORT}:5044"
    environment:
      ASPNETCORE_ENVIRONMENT: ${AUTH_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 5044
      ConnectionStrings__AuthDb: "Host=postgres;Port=5432;Database=${AUTH_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth__Issuer: ${AUTH_ISSUER}
      Auth__ServiceWorker__Secret: ${AUTH_SERVICE_WORKER_SECRET}
      Auth__Certificates__Path: /run/secrets/auth-certs
      Auth__Certificates__Password: ${AUTH_CERT_PASSWORD}
      Auth__DataProtection__Path: /keys
    volumes:
      # read-only: container không có lý do gì để ghi vào đây.
      - ./certs:/run/secrets/auth-certs:ro
      # Key ring mã hóa cookie login - phải sống lâu hơn container.
      - authkeys:/keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5044/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecom-net

  # Product service
  product:
    build:
      context: ..
      dockerfile: services/Product/Ecommerce.Product/Dockerfile
    container_name: ecom-product
    restart: unless-stopped
    ports:
      - "${PRODUCT_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${PRODUCT_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 8080
      # Host=postgres (tên service trong docker network), không phải localhost.
      ConnectionStrings__ProductDb: "Host=postgres;Port=5432;Database=${PRODUCT_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # Chỉ một URL - Product không giữ secret nào để verify token.
      Auth__Authority: ${AUTH_ISSUER}
      Auth__RequireHttpsMetadata: "false"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecom-net

volumes:
  pgdata:
  redisdata:
  kafkadata:
  authkeys:

networks:
  ecom-net:
    driver: bridge
